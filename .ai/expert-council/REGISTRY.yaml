version: 1
name: blender-brace-expert-council
description: Portable, progressively-disclosed expert-council skill system for the Rigo Brace Designer Blender add-on.

# ---------------------------------------------------------------------------
# Layout
# ---------------------------------------------------------------------------
# Canonical skills live here and are provider-neutral. The provider folders are
# thin adapters that point back at the canonical SKILL.md; they never embed
# expert knowledge.
canonical_root: .ai/expert-council/skills
source_archive: .ai/expert-council/source/original-v3
adapters:
  claude: .claude/skills
  codex: .codex/skills

# ---------------------------------------------------------------------------
# Context budget — progressive disclosure is the point of this system
# ---------------------------------------------------------------------------
context_budget:
  default_council: 1 primary + 1-3 secondary + geometry-reliability if P0/P1 + clinical governor if clinical
  load_order: [council-orchestrator, routed SKILL.md files, references only when needed]
  never_autoload:
    - .ai/expert-council/source/original-v3/ALL_EXPERT_CONTEXT_COMBINED.md
    - .ai/expert-council/source/original-v3/EXPERT_SKILLS_01_15_COMBINED.md

# ---------------------------------------------------------------------------
# Decision policy
# ---------------------------------------------------------------------------
decision_policy:
  require_evidence_before_edit: true
  prefer_minimal_patch: true
  preserve_existing_behavior: true
  require_regression_test_for_bug: true
  reliability_review_for_p0_p1: true
  recommendation_labels: [KEEP, HARDEN, REFACTOR, REPLACE KERNEL, DEFER]
  vetoes:
    clinical: expert-manuel-rigo
    biomechanical_claim: expert-carl-eric-aubin
    numerical_topology: expert-jonathan-shewchuk
    blender_state: expert-campbell-barton

# ---------------------------------------------------------------------------
# Skills
# ---------------------------------------------------------------------------
skills:

  council-orchestrator:
    type: orchestrator
    path: skills/council-orchestrator/SKILL.md
    priority: critical
    summary: Classifies the real root problem, routes the smallest sufficient expert set, runs cross-review, emits one verdict.
    domain: [routing, classification, cross_review, disagreement_resolution, verdict]
    references:
      - skills/council-orchestrator/references/orchestrator-context.md
      - skills/council-orchestrator/references/router.yaml
      - skills/council-orchestrator/references/casebook.md
      - skills/council-orchestrator/references/source-ledger.md
    source: [00_MASTER_ORCHESTRATOR.md, 23_SKILL_ROUTER.yaml, 26_COUNCIL_CASEBOOK.md, 24_SOURCE_LEDGER.md]

  expert-ryan-schmidt:
    type: expert
    path: skills/expert-ryan-schmidt/SKILL.md
    priority: critical
    summary: Interactive geometry systems, editable mesh representation, remeshing with constraints, preview/commit lifecycle.
    domain: [interactive_geometry, mesh_editing, remeshing, geometry_kernels, spatial_structures, sdf_implicit, preview_commit, local_mesh_ops]
    references: [skills/expert-ryan-schmidt/references/expert-context.md]
    source: [01_RYAN_SCHMIDT_GEOMETRY_TOOLS.md]

  expert-howard-trickey:
    type: expert
    path: skills/expert-howard-trickey/SKILL.md
    priority: high
    summary: Boolean and solid-geometry robustness; challenges whether Boolean is the right abstraction.
    domain: [boolean, intersection, union_difference, coplanar_overlap, solid_topology, exact_solver]
    references: [skills/expert-howard-trickey/references/expert-context.md]
    source: [02_HOWARD_TRICKEY_ROBUST_BOOLEAN.md]

  expert-jacques-lucke:
    type: expert
    path: skills/expert-jacques-lucke/SKILL.md
    priority: critical
    summary: Procedural and declarative architecture, correction stacks, template vs instance, caching and invalidation.
    domain: [procedural_architecture, declarative_systems, dependency_graph, non_destructive, template_vs_instance, evaluator, caching_invalidation, schema_versioning]
    references: [skills/expert-jacques-lucke/references/expert-context.md]
    source: [03_JACQUES_LUCKE_PROCEDURAL_ARCHITECTURE.md]

  expert-keenan-crane:
    type: expert
    path: skills/expert-keenan-crane/SKILL.md
    priority: critical
    summary: Discrete differential geometry, geodesics, tangent frames, parallel transport, surface fields.
    domain: [geodesic, intrinsic_geometry, tangent_frames, parallel_transport, curvature, laplacian, surface_fields, signed_distance, differential_geometry]
    references: [skills/expert-keenan-crane/references/expert-context.md]
    source: [04_KEENAN_CRANE_DDG.md]

  expert-alec-jacobson:
    type: expert
    path: skills/expert-alec-jacobson/SKILL.md
    priority: high
    summary: Robust geometry processing on dirty scans, winding numbers, validation, fold and inversion detection.
    domain: [robust_geometry, self_intersection, inside_outside, winding_number, pathological_meshes, mesh_validation, constrained_deformation]
    references: [skills/expert-alec-jacobson/references/expert-context.md]
