# ---------------------------------------------------------------------------
# Routing hints. Triggers are HINTS ONLY - the orchestrator classifies the real
# root problem before routing (see ROUTING.md).
# ---------------------------------------------------------------------------
routing:

  mesh_editing:
    triggers: [mesh, remesh, simplify, dynamic_mesh, neighborhood, editable_representation]
    primary: expert-ryan-schmidt
    secondary: [expert-mario-botsch, expert-keenan-crane]

  numerical_robustness:
    triggers: [epsilon, precision, degenerate, collinear, coplanar, determinant, triangle_flip, triangulation, scale]
    primary: expert-jonathan-shewchuk
    secondary: [expert-alec-jacobson, expert-howard-trickey]

  boolean:
    triggers: [boolean, union, difference, intersect, cutter, coplanar_overlap, window, slot]
    primary: expert-howard-trickey
    secondary: [expert-alec-jacobson, expert-jonathan-shewchuk]

  dirty_geometry:
    triggers: [self_intersection, inside_outside, holes, non_manifold, winding, shards]
    primary: expert-alec-jacobson
    secondary: [expert-jonathan-shewchuk, expert-keenan-crane]

  surface_math:
    triggers: [geodesic, curvature, laplacian, tangent, parallel_transport, sdf, intrinsic, surface_field]
    primary: expert-keenan-crane
    secondary: [expert-ryan-schmidt, expert-bruno-levy]

  deformation:
    triggers: [deformation, arap, handle, smooth_transition, detail_preservation, variational, ring, spike]
    primary: expert-olga-sorkine-hornung
    secondary: [expert-keenan-crane, expert-ryan-schmidt, expert-alec-jacobson]

  parameterization:
    triggers: [uv, parameterization, flatten, lscm, chart, local_2d, distortion, foldover]
    primary: expert-bruno-levy
    secondary: [expert-keenan-crane, expert-olga-sorkine-hornung]

  mesh_data_structure:
    triggers: [halfedge, adjacency, decimation, mesh_health, valence, local_remesh]
    primary: expert-mario-botsch
    secondary: [expert-ryan-schmidt, expert-jonathan-shewchuk]

  procedural_architecture:
    triggers: [procedural, non_destructive, dependency, correction_stack, template, instance, evaluator, preset_versioning]
    primary: expert-jacques-lucke
    secondary: [expert-ryan-schmidt, expert-sybren-stuvel, expert-campbell-barton]

  blender_platform:
    triggers: [bpy, bmesh, operator, modal, context, undo, depsgraph, handler, selection_dependency]
    primary: expert-campbell-barton
    secondary: [expert-sybren-stuvel, expert-ryan-schmidt]

  blender_python_maintainability:
    triggers: [reload, registration, module, readability, duplicate_code, addon_package, exception_path]
    primary: expert-sybren-stuvel
    secondary: [expert-campbell-barton, geometry-reliability]

  computational_design:
    triggers: [optimization, inverse_design, manufacturing, fabrication, design_variables, lighter, material]
    primary: expert-mark-pauly
    secondary: [expert-carl-eric-aubin]

  biomechanics:
    triggers: [fem, force, predicted_pressure, simulation, brace_mechanics, patient_specific, cobb]
    primary: expert-carl-eric-aubin
    secondary: [expert-mark-pauly, expert-manuel-rigo]

  rigo_clinical:
    triggers: [rigo, cheneau, scoliosis, thoracic_pressure, expansion_area, derotation, sagittal, blueprint, curve_pattern]
    primary: expert-manuel-rigo
    secondary: [expert-carl-eric-aubin]

  reliability:
    triggers: [regression, benchmark, release, p95, deterministic, reproducibility, profiling]
    primary: geometry-reliability
    secondary: []

  repository_audit:
    triggers: [audit, unfamiliar_subsystem, architecture_map, systemic_bug, repo_health]
    primary: repo-audit
    secondary: [council-orchestrator]

  pressure_expansion_library:
    triggers: [pressure_library, expansion_library, correction_region, reusable_region, movable_region, correction_template, correction_instance, correction_style]
    primary: pressure-expansion-system
    required:
      - expert-jacques-lucke
      - expert-ryan-schmidt
      - expert-keenan-crane
      - expert-olga-sorkine-hornung
      - expert-manuel-rigo
      - geometry-reliability

# ---------------------------------------------------------------------------
# Deterministic routing scenarios (exercised by tools/test_routing.py)
# ---------------------------------------------------------------------------
scenarios:

  - id: ring-after-move
    input: Pressure patch develops a ring after moving it.
    primary: expert-olga-sorkine-hornung
    secondary: [expert-keenan-crane, expert-ryan-schmidt]
    clinical: [expert-manuel-rigo]
    verification: [geometry-reliability]
    note: Transition energy discontinuity, not a smoothing-iteration shortage.

  - id: correction-misplaced-after-remesh
    input: The saved correction moves to the wrong location after remeshing.
    primary: expert-ryan-schmidt
    secondary: [expert-mario-botsch, expert-keenan-crane, expert-jacques-lucke]
    verification: [geometry-reliability]
    note: Persistent attachment likely depends on topology identity rather than geometric or anatomical identity.

  - id: boolean-shards-some-scans
    input: Boolean creates shards only on some patient scans.
    primary: expert-howard-trickey
    secondary: [expert-alec-jacobson, expert-jonathan-shewchuk, expert-ryan-schmidt]
    verification: [geometry-reliability]
    note: Classify Boolean intent and input validity before tolerance tuning.

  - id: modal-tool-selection-dependent
    input: Modal pressure tool works only if a certain object is selected.
    primary: expert-campbell-barton
    secondary: [expert-sybren-stuvel, expert-ryan-schmidt]
    note: Blender context and state coupling, not geometry.

  - id: reusable-oval-templates
    input: I want reusable oval pressure templates that can be moved on any torso.
    primary: pressure-expansion-system
    secondary: [expert-jacques-lucke, expert-ryan-schmidt, expert-keenan-crane, expert-olga-sorkine-hornung, expert-bruno-levy]
    clinical: [expert-manuel-rigo]
    verification: [geometry-reliability]
    note: Template versus instance, durable surface attachment, chart distortion.

  - id: increase-pressure-20-to-25
    input: Increase pressure from 20 to 25.
    primary: expert-manuel-rigo
    secondary: [expert-carl-eric-aubin]
    note: Determine what pressure means. If it is geometric displacement, correct the terminology to geometric depth in mm unless a validated mechanical model exists.
